<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickNotes App</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <h1>QuickNotes</h1>
    <p>Your simple, fast, and organized note-taking companion.</p>
  </header>

  <main>
    <section class="card-section">
      <h2>Add a note</h2>
      <form id="note-form">
        <div class="form-group">
          <label for="note-input">Note Text:</label>
          <input type="text" id="note-input" placeholder="Type your note here (max 200 chars)..." autocomplete="off">
        </div>
        <div class="form-group">
          <label for="note-category">Category:</label>
          <select id="note-category">
            <option value="personal">Personal</option>
            <option value="work">Work</option>
            <option value="study">Study</option>
          </select>
        </div>
        <button type="submit">Add Note</button>
      </form>
      <p id="error-message" class="error-text"></p>
    </section>

    <section class="card-section">
      <h2>Your notes</h2>
      <div class="search-container">
        <input type="text" id="search-input" placeholder="Search notes..." autocomplete="off">
      </div>
      <p id="note-count">You have no notes yet.</p>
      <ul id="notes-list"></ul>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 QuickNotes App. All rights reserved.</p>
  </footer>
</body>
</html>
